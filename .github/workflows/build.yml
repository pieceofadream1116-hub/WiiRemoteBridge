name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build one-file app
        run: >
          dotnet publish src/WiiRemotePairer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Build the bridge
        run: >
          dotnet publish bridge/WiiRemoteBridge.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WiiRemoteApps
          path: |
            out/WiiRemotePairer.exe
            out/WiiRemoteBridge.exe

      - name: Put the app on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/WiiRemotePairer.exe out/WiiRemoteBridge.exe --title "Wii Remote apps (latest build)" --notes "WiiRemoteBridge.exe sends a Wii Remote (through a Dolphin Bar on mode 4) to Dolphin on another device, like WiimoteHook. WiiRemotePairer.exe pairs remotes over Bluetooth."
